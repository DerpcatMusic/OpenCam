[package]
name = "opencam"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Native USB and Wi-Fi Camera2 studio for Android phones"
repository = "https://github.com/DerpcatMusic/OpenCam"
homepage = "https://github.com/DerpcatMusic/OpenCam"

[dependencies]
anyhow = "1"
gpui = { git = "https://github.com/zeronsh/zui", rev = "dce5c1f737a834b32c2b531d552ea78035e54093" }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "dce5c1f737a834b32c2b531d552ea78035e54093", features = ["x11", "wayland", "font-kit", "runtime_shaders"] }
gpui-base = { git = "https://github.com/zeronsh/gpui-component", rev = "47ccd07295858d66f8fe826df9651a56218eb887" }
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
sha2 = "0.10"
ring = "0.17"
mdns-sd = "=0.21.4"
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["codec", "format", "software-scaling"] }
wgpu = { version = "=29.0.4", default-features = false, features = ["std", "vulkan", "dx12", "metal", "wgsl"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-22", "cuda", "rocm", "migraphx", "openvino", "directml", "coreml"] }

[build-dependencies]
cc = "1"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"

[[bin]]
name = "opencam"
path = "desktop/main.rs"

[[bin]]
name = "opencam-probe"
path = "desktop/probe.rs"
